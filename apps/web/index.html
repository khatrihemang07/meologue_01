<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      `viewport-fit=cover` is what makes `env(safe-area-inset-*)` resolve to
      anything other than 0. Every use of it in this app — Shell's own edges,
      the docked Composer, the bottom sheet — was written expecting real
      numbers and silently got zeros until this key landed.

      `interactive-widget=resizes-content` makes the virtual keyboard shrink
      the *layout* viewport rather than sliding the visual one over the top,
      so the docked Composer ends up above the keyboard instead of behind it.
      It is a Chromium-only key: Android's WebView and the web build honour
      it, WKWebView (what Tauri renders in) ignores it entirely. That second
      engine is why `useKeyboardInset` exists — see its own doc comment.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      Matches vite.config.ts's VitePWA manifest theme_color (ticket 45) — the
      browser chrome and the OS task switcher use this, and it's not
      something the manifest link (auto-injected by the plugin, unlike this
      meta tag) covers on its own. Only meaningful on the web build; Android
      and macOS never register the plugin, so this tag exists unused there,
      which costs nothing.
    -->
    <meta name="theme-color" content="#18181B" />
    <title>meologue</title>
    <!--
      Puts the theme class on <html> before the browser's first paint. This has
      to be an inline, blocking script rather than main.tsx: the app bundle is a
      deferred module, so the stylesheet lands and paints :root's light palette
      while the bundle is still being fetched. Verified as a real flash of white
      when reloading a Device set to Dark. Keep the key and the resolution below
      in step with src/lib/settings.ts and src/lib/theme.ts — main.tsx applies
      the same theme again once it runs, so this is a paint-time head start, not
      a second source of truth.
    -->
    <script>
      try {
        const stored = localStorage.getItem("meologue.theme");
        const dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {
        // Storage refused (private browsing) — fall through to the light default.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
