[package]
name = "meologue-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.6.11", features = ["fs"] }
utoipa = { version = "5.5.0", features = ["uuid", "chrono"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1.4"
tower = { version = "0.5.3", features = ["util"] }
