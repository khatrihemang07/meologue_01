services:
  # The personal instance's database (issue #74). Nothing that runs as a test
  # touches this one: the Sandbox below has its own container, its own port
  # and its own volume, and every script that exists for testing names
  # `postgres-sandbox` explicitly rather than falling back to this service.
  postgres:
    image: pgvector/pgvector:pg18
    container_name: meologue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meologue
      POSTGRES_PASSWORD: meologue
      POSTGRES_DB: meologue
    ports:
      - "5432:5432"
    volumes:
      - meologue-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meologue -d meologue"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The Sandbox instance's database (issue #74) — a fully separate Postgres,
  # not a second database inside the one above. That separation is the whole
  # point: a `docker compose down -v` or a stray DROP aimed at testing cannot
  # reach the personal instance's volume, which is exactly the accident this
  # replaced.
  #
  # It holds three databases:
  #   meologue        the seeded Sandbox journal (scripts/seed-sandbox.sh),
  #                   served by scripts/sandbox-server.sh on :41307
  #   meologue_e2e_a  server A for the Playwright suite
  #   meologue_e2e_b  server B for the Playwright suite
  #
  # The two e2e databases live here rather than in a third container. ADR 0011's
  # multi-server spec needs its two Servers to share no database — which two
  # databases in one cluster already satisfy — so the separate `postgres-e2e-b`
  # container this replaces was buying isolation that was never the thing under
  # test. scripts/e2e.sh recreates both empty before every run.
  #
  # Behind the "sandbox" profile so a plain `docker compose up -d` — the
  # everyday personal workflow (README.md) — starts only the instance above.
  # Compose still starts this one when a script names it explicitly
  # (`docker compose up -d --wait postgres-sandbox`), profile or not.
  #
  # To wipe the Sandbox and start it over, NAME THE SERVICE:
  #
  #     docker compose down -v postgres-sandbox
  #
  # Not `docker compose --profile sandbox down -v`. A profile *widens* the set
  # of services a command applies to, it does not narrow it — so that second
  # form removes `meologue-pgdata` as well and takes the personal instance's
  # Entries with it. Verified with `--dry-run`, after doing it for real.
  postgres-sandbox:
    image: pgvector/pgvector:pg18
    container_name: meologue-postgres-sandbox
    restart: unless-stopped
    profiles: ["sandbox"]
    environment:
      POSTGRES_USER: meologue
      POSTGRES_PASSWORD: meologue
      POSTGRES_DB: meologue
    ports:
      - "5442:5432"
    volumes:
      - meologue-pgdata-sandbox:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meologue -d meologue"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  meologue-pgdata:
  meologue-pgdata-sandbox:
