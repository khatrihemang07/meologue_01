services:
  postgres:
    image: postgres:18-alpine
    container_name: meologue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meologue
      POSTGRES_PASSWORD: meologue
      POSTGRES_DB: meologue
    ports:
      - "5432:5432"
    volumes:
      - meologue-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meologue -d meologue"]
      interval: 2s
      timeout: 2s
      retries: 15

  # A second, fully independent Postgres for the e2e multi-server harness
  # (ADR 0011): its own container, its own port, its own volume, sharing
  # nothing with `postgres` above. That independence is the point — the
  # multi-server spec proves Entries stay routed by Server URL alone, which
  # a shared database would defeat.
  #
  # Behind the "e2e" profile so a plain `docker compose up -d` — the everyday
  # dev workflow (README.md) — doesn't also start this one. Compose still
  # starts it when scripts/e2e-server-b.sh names it explicitly
  # (`docker compose up -d --wait postgres-e2e-b`), profile or not.
  postgres-e2e-b:
    image: postgres:18-alpine
    container_name: meologue-postgres-e2e-b
    restart: unless-stopped
    profiles: ["e2e"]
    environment:
      POSTGRES_USER: meologue
      POSTGRES_PASSWORD: meologue
      POSTGRES_DB: meologue
    ports:
      - "5433:5432"
    volumes:
      - meologue-pgdata-e2e-b:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meologue -d meologue"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  meologue-pgdata:
  meologue-pgdata-e2e-b:
